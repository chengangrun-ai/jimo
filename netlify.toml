[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = [
    "data/index.json",
    "data/agent-kit.json",
    "data/code/**",
    "data/tsx/components/**",
    "data/tsx/blocks/**",
    "data/tsx/app-ui/**",
    "data/tsx/_helpers/**",
    "vendor/**",
    "node_modules/three/**",
    "node_modules/@react-three/fiber/**",
    "node_modules/@react-three/drei/**",
    "node_modules/gsap/**",
    "node_modules/motion/**",
    "node_modules/lucide-react/**",
    "node_modules/ogl/**",
    "node_modules/react/**",
    "node_modules/react-dom/**",
    "node_modules/scheduler/**"
  ]
  node_bundler = "esbuild"

[functions."app/render/**"]
  maxDuration = 60

[functions."app/api/bundle/**"]
  maxDuration = 60